<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Makmal Molekular Genetik - HTA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      display: flex;
      justify-content: center;
      padding: 16px 12px;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      max-width: 480px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.06), 0 8px 10px -6px rgba(0,0,0,0.02);
      border: 1px solid #e2e8f0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #ffffff;
      padding: 22px 18px;
      text-align: center;
      border-bottom: 3px solid #0284c7;
    }
    .header h1 {
      font-size: 1rem;
      font-weight: 800;
      line-height: 1.4;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .header p {
      font-size: 0.72rem;
      color: #94a3b8;
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .content {
      padding: 20px 18px;
      flex-grow: 1;
    }
    .badge {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.35;
      margin-bottom: 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 20px;
    }
    .field-label {
      font-size: 0.7rem;
      color: #64748b;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .field-val {
      font-size: 0.9rem;
      font-weight: 600;
      color: #1e293b;
      word-break: break-word;
    }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1.5px solid #e2e8f0;
    }
    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #0f172a;
    }
    .counter {
      background: #f1f5f9;
      color: #475569;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }
    .list {
      list-style: none;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      max-height: 280px;
      overflow-y: auto;
      background: #ffffff;
    }
    .list-item {
      display: flex;
      align-items: center;
      padding: 9px 12px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.85rem;
      color: #1e293b;
    }
    .list-item:last-child { border-bottom: none; }
    .num {
      background: #e2e8f0;
      color: #475569;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      margin-right: 10px;
      flex-shrink: 0;
    }
    .footer {
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      padding: 14px;
      text-align: center;
      font-size: 0.75rem;
      color: #64748b;
    }
    .footer a {
      color: #0284c7;
      text-decoration: none;
      font-weight: 600;
    }
    #loading {
      text-align: center;
      padding: 40px 20px;
      color: #64748b;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>Makmal Molekular Genetik, Jabatan Patologi, Hospital Tunku Azizah</h1>
      <p>Instrument Verification Portal</p>
    </div>

    <div id="loading">Retrieving instrument record...</div>

    <div class="content" id="portal-content" style="display:none;">
      <span class="badge">Verified Equipment</span>
      <div class="title" id="inst-name"></div>

      <div class="grid">
        <div>
          <div class="field-label">Asset No</div>
          <div class="field-val" id="inst-asset"></div>
        </div>
        <div>
          <div class="field-label">Location</div>
          <div class="field-val" id="inst-loc"></div>
        </div>
        <div>
          <div class="field-label">Authorised By</div>
          <div class="field-val" id="inst-auth"></div>
        </div>
        <div>
          <div class="field-label">Date</div>
          <div class="field-val" id="inst-date"></div>
        </div>
      </div>

      <div class="section-head">
        <span class="section-title">Authorised Personnel</span>
        <span class="counter" id="person-count">0 Pax</span>
      </div>
      <ul class="list" id="person-list"></ul>
    </div>

    <div class="footer">
      © <a href="mailto:molekulargenetik.hta@moh.gov.my">molekulargenetik.hta@moh.gov.my</a>
    </div>
  </div>

  <script>
    // 1. Paste your Published Google Sheet CSV URL here:
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRQr-gx3YbedYQd_2BE5q_x-crxdsgIge_zdE58jzET4Qit7gaszvzIIjCJnR6ksLgEcdnBuowK8kzR/pub?gid=0&single=true&output=csv";

    function parseCSV(text) {
      let p = '', c = '', r = [];
      let q = false;
      let row = [''];
      for (let i = 0; i < text.length; i++) {
        c = text[i];
        let next = text[i+1];
        if (c === '"') {
          if (q && next === '"') { row[row.length - 1] += '"'; i++; }
          else { q = !q; }
        } else if (c === ',' && !q) {
          row.push('');
        } else if ((c === '\r' || c === '\n') && !q) {
          if (c === '\r' && next === '\n') { i++; }
          r.push(row);
          row = [''];
        } else {
          row[row.length - 1] += c;
        }
      }
      if (row.length > 1 || row[0] !== '') r.push(row);
      return r;
    }

    const params = new URLSearchParams(window.location.search);
    const targetAsset = (params.get('asset') || '').trim().toLowerCase();

    fetch(CSV_URL)
      .then(res => res.text())
      .then(csvText => {
        const rows = parseCSV(csvText);
        let found = null;

        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          const assetNo = (row[1] || '').trim();
          if (targetAsset && assetNo.toLowerCase() === targetAsset) {
            found = {
              name: row[0],
              assetNo: row[1],
              location: row[2],
              personnelRaw: row[3] || '',
              authBy: row[4] || '-',
              date: row[5] || '-'
            };
            break;
          }
        }

        document.getElementById('loading').style.display = 'none';

        if (found) {
          document.getElementById('inst-name').textContent = found.name;
          document.getElementById('inst-asset').textContent = found.assetNo;
          document.getElementById('inst-loc').textContent = found.location;
          document.getElementById('inst-auth').textContent = found.authBy;
          document.getElementById('inst-date').textContent = found.date;

          // Split multiline or comma separated personnel (14 pax)
          const persons = found.personnelRaw
            .split(/[\r\n,]+/)
            .map(p => p.trim())
            .filter(p => p.length > 0);

          document.getElementById('person-count').textContent = persons.length + ' Pax';
          
          const listEl = document.getElementById('person-list');
          listEl.innerHTML = persons.map((p, idx) => `
            <li class="list-item">
              <span class="num">${idx + 1}</span>
              <span>${p}</span>
            </li>
          `).join('');

          document.getElementById('portal-content').style.display = 'block';
        } else {
          document.getElementById('loading').innerHTML = `
            <div style="color: #dc2626; font-weight: bold; margin-bottom: 8px;">Instrument Not Found</div>
            <div style="font-size: 0.85rem;">The asset "${targetAsset}" does not exist in the registry.</div>
          `;
          document.getElementById('loading').style.display = 'block';
        }
      })
      .catch(err => {
        document.getElementById('loading').innerHTML = `
          <div style="color: #dc2626;">Failed to load data. Please check your internet connection and try again.</div>
        `;
      });
  </script>
</body>
</html>
